approval_policy = "on-request"
sandbox_mode = "workspace-write"
model = "gpt-5.5"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
model_verbosity = "medium"
personality = "pragmatic"
model_reasoning_summary = "auto"

project_doc_max_bytes = 32768
project_doc_fallback_filenames = ["README.md"]

file_opener = "cursor"

[features]
multi_agent = true
shell_snapshot = true
child_agents_md = true

[agents]
# Official Codex docs default to max_depth = 1 and use max_threads = 6 in
# custom-agent examples. Keep depth shallow so project agents cannot fan out
# recursively while still allowing a small review/research team.
max_threads = 6
max_depth = 1
job_max_runtime_seconds = 1800
